<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>横屏视频 Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <span>视频 Banner</span>
      <span id="index" aria-hidden="true">01 / 05</span>

    <div class="viewport" id="viewport" aria-roledescription="carousel" aria-label="横屏视频 Banner"></div>
    <p class="theme-line" id="theme-line"></p>
    <div class="themes" id="themes"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
